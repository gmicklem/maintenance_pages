<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumanMine server - scheduled maintenance</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { max-width: 500px; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h1 { color: #0f172a; font-size: 1.8rem; margin-bottom: 1rem; }
        p { line-height: 1.6; color: #475569; }
        .status-badge { background: #fee2e2; color: #dc2626; padding: 8px 16px; border-radius: 99px; font-weight: 600; display: inline-block; margin-bottom: 20px; }
        .spinner { border: 3px solid #f1f5f9; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer { font-size: 0.8rem; color: #94a3b8; margin-top: 30px; }
        .manual-link { margin-top: 15px; font-size: 0.85rem; }
        .manual-link a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge">Server Maintenance</div>
        <h1>HumanMine is Offline</h1>
        <p>The server hosting HumanMine is undergoing scheduled maintenance, which is expected to be complete by 13.00 GMT Sunday 15 Mar 2026</p>

        <div class="spinner"></div>
        <p style="font-size: 0.9rem;">Checking system status... Page will refresh automatically.</p>

        <div class="manual-link">
            <a href="https://www.humanmine.org">Click here to try manual redirect</a>
        </div>

        <div class="footer">Thank you for your patience.</div>
    </div>

    <script>
        // CONFIGURATION FOR HUMANMINE
        // We use the 'monitor' subdomain to bypass Virtual Hosting issues
        const MONITOR_URL = "http://monitor.humanmine.org"; 
        const SITE_URL = "https://www.humanmine.org";

        function checkStatus() {
            fetch(MONITOR_URL, { mode: 'no-cors', cache: 'no-store' })
            .then(() => {
                console.log("Server detected! Redirecting to HumanMine...");
                window.location.href = SITE_URL;
            })
            .catch(() => console.log("Server still down..."));
        }
        setInterval(checkStatus, 30000); // Check every 30 seconds
    </script>
</body>
</html>
